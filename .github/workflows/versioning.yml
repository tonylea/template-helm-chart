name: Versioning

on:
  push:
    branches: [main]

jobs:
  release:
    # A repo made from this template creates main with its first push, before its deploy key exists,
    # so a release then could push its tag but not main.
    if: ${{ !github.event.created }}
    uses: tonylea/ci-templates/.github/workflows/versioning-common.yml@v1.3.4
    permissions:
      contents: write
    secrets:
      release-deploy-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

  publish:
    needs: [release]
    if: needs.release.outputs.version != ''
    uses: tonylea/ci-templates/.github/workflows/versioning-helm.yml@v1.3.4
    permissions:
      contents: write
      pages: write
      id-token: write
    with:
      version: ${{ needs.release.outputs.version }}
