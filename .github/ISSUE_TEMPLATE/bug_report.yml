name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The values you installed with, and the steps needed to see the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The chart version you're using, for example 1.0.0.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Kubernetes and Helm versions, [what the chart depends on, such as the storage behind /config or the Postgres version], and the image tag if it isn't the chart's appVersion.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from the pod's app-name container. Remove anything secret first, such as API keys and passwords.
      render: text
